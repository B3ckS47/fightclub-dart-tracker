<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightClub · Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <script src="config.js"></script>
    <script src="ui-utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("fc47_theme")||"dark");</script>
</head>
<body>

    <!-- ── NAV ── -->
    <nav id="nav-dashboard">
        <div class="nav-inner nav-inner--default">
            <a href="index.html" class="nav-brand" style="text-decoration:none;color:inherit;">FLIGHTCLUB</a>
            <div class="nav-links">
                <a href="index.html" class="nav-btn">« Menü</a>
            </div>
        </div>
    </nav>

    <div class="app-wrapper">

        <!-- LEADERBOARD -->
        <div id="stats-page">
            <div class="card">
                <div class="register-section">
                    <h3 class="section-label">Neuen Spieler hinzufügen</h3>
                    <div class="register-row">
                        <input type="text" id="reg-name" placeholder="Nickname eingeben" class="input-field">
                        <button onclick="registerPlayer()" class="btn btn-accent">HINZUFÜGEN</button>
                    </div>
                </div>
                <div class="divider"></div>
                <div>
                    <div class="filter-bar">
                        <button class="filter-btn filter-btn--active" onclick="setFilter('all',  this)">Gesamt</button>
                        <button class="filter-btn"                    onclick="setFilter('3m',   this)">3 Monate</button>
                        <button class="filter-btn"                    onclick="setFilter('30d',  this)">30 Tage</button>
                    </div>
                    <div class="player-tab-switch">
                        <button id="tab-members" class="player-tab player-tab--active" onclick="setPlayerTab('members')">Mitglieder</button>
                        <button id="tab-guests"  class="player-tab"                   onclick="setPlayerTab('guests')">Gäste</button>
                    </div>
                    <div id="player-list-box" class="player-list">
                        <p class="muted-text">Lade Mitglieder...</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        function setFilter(range, btn) {
            // Update active button
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('filter-btn--active'));
            btn.classList.add('filter-btn--active');

            const now = new Date();
            let fromDate = null;

            if (range === '30d') {
                fromDate = new Date(now);
                fromDate.setDate(fromDate.getDate() - 30);
            } else if (range === '3m') {
                fromDate = new Date(now);
                fromDate.setMonth(fromDate.getMonth() - 3);
            } else if (range === 'season') {
                // Season runs Sept 1 → May 31; pick the right year
                const sept = new Date(now.getFullYear(), 8, 1); // Sept 1 this year
                fromDate   = now >= sept ? sept : new Date(now.getFullYear() - 1, 8, 1);
            }
            // 'all' → fromDate stays null

            applyFilter(fromDate);
        }
    </script>
    <script src="database.js"></script>
    <script src="ui-manager-dashboard.js"></script>

    <script>
        // Auth guard + show danger zone for admins only
        (function() {
            var raw = sessionStorage.getItem('fc47_user');
            if (!raw) { window.location.href = 'index.html'; return; }
            var u = JSON.parse(raw);
            if (u.role === 'ipad') window.location.href = 'game.html';
            window.loggedInUser = u;
        })();
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/fightclub-dart-tracker/sw.js')
                .catch(() => {}); // silently ignore errors on local dev
        }
    </script>
</body>
</html>
