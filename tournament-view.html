<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlightClub · Turnier</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d0d0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script src="config.js"></script>
    <script src="ui-utils.js"></script>
    <script src="tournament-logic.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>document.documentElement.setAttribute("data-theme",localStorage.getItem("fc47_theme")||"dark");</script>
</head>
<body>
    <!-- Joker partner bottom sheet (doubles with an odd number of players) -->
    <div id="joker-sheet-overlay" class="entry-sheet-overlay" onclick="closeJokerSheet()" style="display:none;"></div>
    <div id="joker-sheet" class="entry-sheet" style="display:none;">
        <div class="entry-sheet-handle"></div>
        <div class="entry-sheet-content">
            <h2 class="card-title" style="margin-bottom:6px;">🎲 JOKER-PARTNER</h2>
            <p class="muted-text" id="joker-sheet-sub" style="margin-bottom:12px;"></p>
            <div class="divider" style="margin-bottom:12px;"></div>
            <div class="joker-partner-box">
                <div class="joker-partner-name" id="joker-partner-name">–</div>
                <div class="joker-partner-hint" id="joker-partner-hint"></div>
            </div>
            <div id="joker-manual-list" class="guest-pick-list" style="display:none; margin-bottom:12px;"></div>
            <div class="schedule-form">
                <div class="joker-btn-row">
                    <button id="joker-reroll-btn" class="btn btn-ghost btn-full" onclick="rerollJoker()">🎲 NEU WÜRFELN</button>
                    <button id="joker-manual-btn" class="btn btn-ghost btn-full" onclick="toggleJokerManual()">✋ MANUELL</button>
                </div>
                <button id="joker-start-btn" class="btn btn-accent btn-full" onclick="startJokerMatch()">SPIEL STARTEN</button>
                <button class="btn btn-full" onclick="closeJokerSheet()" style="background:var(--bg-element); color:var(--text-secondary);">ABBRECHEN</button>
            </div>
        </div>
    </div>

    <nav id="nav-tournament-view">
        <div class="nav-inner nav-inner--default">
            <span class="nav-brand">FLIGHTCLUB</span>
            <div class="nav-links">
                <a href="tournaments.html" class="nav-btn">« Turniere</a>
            </div>
        </div>
    </nav>

    <div class="app-wrapper">

        <!-- 1) Header: Turniername, Tags, Close-Button -->
        <div class="card" id="tourn-header-card">
            <div class="tourn-header-row">
                <h2 class="card-title" id="tourn-title">–</h2>
                <span id="tourn-status-badge" class="tourn-status"></span>
            </div>
            <div class="tourn-tags" id="tourn-setup-tags" style="margin-top:8px;"></div>
            <div id="close-btn-wrap" style="display:none; margin-top:14px;">
                <button class="btn btn-danger btn-full" onclick="closeTournament()">TURNIER SCHLIESSEN</button>
            </div>
        </div>

        <!-- 2) Alle Spiele: Winner + Loser zusammen, farblich unterschieden -->
        <div id="all-matches-section" style="display:none;">
            <h2 class="section-title" id="all-matches-title">AKTUELLE PARTIEN</h2>
            <div id="all-matches-list"></div>
        </div>

        <!-- Swiss "Sofort": wer wartet gerade auf einen Gegner -->
        <div id="instant-waiting-card" class="card" style="display:none;">
            <h2 class="card-title">⏳ WARTET AUF GEGNER</h2>
            <div class="divider"></div>
            <div id="instant-waiting-list"></div>
        </div>

        <!-- Für K.O.-Modus: nur Winner-Matches -->
        <div id="current-round-section" style="display:none;">
            <h2 class="section-title" id="current-round-title">AKTUELLE RUNDE</h2>
            <div id="current-round-matches"></div>
        </div>

        <!-- 3) Winner-Pool Turnierbaum -->
        <div class="card">
            <h2 class="card-title" id="bracket-title">TURNIERPLAN</h2>
            <div class="divider"></div>
            <div id="bracket-tree" class="bracket-tree"></div>
        </div>

        <!-- 4) Loser-Pool Turnierbaum -->
        <div id="loser-bracket-card" class="card" style="display:none; margin-top:24px;">
            <h2 class="card-title">LOSER-POOL · 1 NIEDERLAGE</h2>
            <div class="divider"></div>
            <div id="loser-bracket-tree" class="bracket-tree"></div>
        </div>

        <!-- Swiss "Sofort": bisherige Ergebnisse -->
        <div id="instant-results-card" class="card" style="display:none; margin-top:24px;">
            <h2 class="card-title">BISHERIGE ERGEBNISSE</h2>
            <div class="divider"></div>
            <div id="instant-results-list"></div>
        </div>

        <!-- 5) Swiss Standings -->
        <div id="swiss-standings-card" class="card" style="display:none; margin-top:24px;">
            <h2 class="card-title">SWISS · STANDINGS</h2>
            <div class="divider"></div>
            <div id="swiss-standings"></div>
        </div>

        <!-- Bounty Hunter: aktuelle Partien -->
        <div id="bounty-matches-section" style="display:none;">
            <h2 class="section-title" id="bounty-matches-title">AKTUELLE RUNDE</h2>
            <div id="bounty-matches-list"></div>
        </div>

        <!-- Bounty Hunter: Standings -->
        <div id="bounty-standings-card" class="card" style="display:none; margin-top:24px;">
            <h2 class="card-title">💰 BOUNTY HUNTER · STANDINGS</h2>
            <div class="divider"></div>
            <div id="bounty-standings"></div>
        </div>

    </div>

    <script>
        const supa = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);
        const raw  = sessionStorage.getItem('fc47_user');
        if (!raw) window.location.href = 'index.html';
        const user  = JSON.parse(raw);
        const params = new URLSearchParams(window.location.search);
        const tournId = params.get('id');
        if (!tournId) window.location.href = 'tournaments.html';

        let tournament = null;
        let participants = [];
        let matches = [];

        const MODE_LABEL  = { ko: 'K.O.', swiss: 'Swiss', bounty: 'Bounty Hunter' };
        const TYPE_LABEL  = { singles: 'Einzel', doubles: 'Doppel' };
        const OUT_LABEL   = { single: 'Single Out', double: 'Double Out' };
        const LEGS_LABEL  = l => `First to ${l} ${l === 1 ? 'Leg' : 'Legs'}`;

        function partName(id) {
            if (!id) return 'BYE';
            const p = participants.find(p => p.id === id);
            return p ? p.name : '?';
        }

        function partNameShort(id) {
            const n = partName(id);
            return n.length > 14 ? n.slice(0, 13) + '…' : n;
        }

        async function load() {
            const { data: t } = await supa
                .from('tournaments')
                .select('*')
                .eq('id', tournId)
                .single();
            if (!t) { window.location.href = 'tournaments.html'; return; }
            tournament = t;

            const { data: parts } = await supa
                .from('tournament_participants')
                .select('id, name, seed, wins, losses, bye_count, lives, bounty')
                .eq('tournament_id', tournId)
                .order('seed');
            participants = parts || [];

            const { data: mts } = await supa
                .from('tournament_matches')
                .select('*')
                .eq('tournament_id', tournId)
                .order('round')
                .order('match_number');
            matches = mts || [];

            // Auto-close if no open matches remain (only if not already closed)
            if (tournament.status === 'active' && !tournament.finished_at) {
                const open = matches.filter(m => m.status === 'pending' && m.p1_id && m.p2_id);
                if (open.length === 0) {
                    const done = matches.filter(m => m.status === 'done');
                    if (done.length > 0) {
                        const finalMatch = done.find(m => m.bracket === 'final');
                        if (finalMatch?.winner_id && finalMatch?.loser_id) {
                            let thirdId = null;
                            const now = new Date().toISOString();
                            const { error } = await supa.from('tournaments').update({
                                status:       'finished',
                                winner_id:    finalMatch.winner_id,
                                runner_up_id: finalMatch.loser_id,
                                third_id:     thirdId,
                                finished_at:  now
                            }).eq('id', tournId);
                            if (error) {
                                console.error('Auto-Close fehlgeschlagen:', error.message);
                            } else {
                                tournament.status       = 'finished';
                                tournament.winner_id    = finalMatch.winner_id;
                                tournament.runner_up_id = finalMatch.loser_id;
                                tournament.third_id     = thirdId;
                                tournament.finished_at  = now;
                            }
                        }
                    }
                }
            }

            render();
            if (isInstant()) sweepInstantPairing();
        }

        // Swiss with instant pairing: no rounds, no bracket tree
        const isInstant = () => tournament && tournament.mode === 'swiss' && tournament.pairing === 'instant';

        // Whoever has the page open pairs what can be paired: normally the result handler on
        // the game page already did it; this catches the rare case that two results
        // collided or a device went offline right at that moment. Reservations
        // (tournament-logic.js) make it safe to run from several devices at once.
        let _sweeping = false;
        async function sweepInstantPairing() {
            if (_sweeping || tournament.status !== 'active') return;
            const plan = planInstantPairs(participants.map(p => ({ id: p.id, seed: p.seed })), matches);
            if (!plan.final && plan.pairs.length === 0) return;
            _sweeping = true;
            try { await pairFreePlayers(tournId); await load(); }
            catch (e) { console.error('Nachpaarung fehlgeschlagen:', e); }
            finally { _sweeping = false; }
        }

        function renderInstantExtras() {
            const done    = matches.filter(m => m.status === 'done' && m.p2_id);          // byes excluded
            const pending = matches.filter(m => m.status === 'pending' && m.p1_id && m.p2_id);
            const losses  = id => done.filter(m => m.loser_id === id).length;
            const busy    = new Set();
            pending.forEach(m => { busy.add(m.p1_id); busy.add(m.p2_id); });

            // Waiting for an opponent
            const waiting = participants.filter(p => losses(p.id) < 2 && !busy.has(p.id));
            const wCard   = document.getElementById('instant-waiting-card');
            if (tournament.status !== 'active' || waiting.length === 0) {
                wCard.style.display = 'none';
            } else {
                wCard.style.display = 'block';
                document.getElementById('instant-waiting-list').innerHTML = waiting.map(p => {
                    const l = losses(p.id);
                    return `<div class="swiss-standing-row ${l === 0 ? 'swiss-standing--winner' : 'swiss-standing--loser'}">
                        <span class="swiss-standing-name">${p.name}</span>
                        <span class="swiss-standing-record">${l === 0 ? '🟢 Winner Pool' : '🟡 Loser Pool'}</span>
                        <span></span>
                        <span class="swiss-standing-status">wartet</span>
                    </div>`;
                }).join('');
            }

            // Results so far, newest first
            const rCard = document.getElementById('instant-results-card');
            if (done.length === 0) { rCard.style.display = 'none'; return; }
            rCard.style.display = 'block';
            const order = [...done].sort((a, b) => (Date.parse(b.finished_at) || 0) - (Date.parse(a.finished_at) || 0) || b.round - a.round);
            document.getElementById('instant-results-list').innerHTML = order.map(m => {
                const tag = m.bracket === 'final' ? '🏆 Finale' : m.bracket === 'losers' ? 'Loser Pool' : 'Winner Pool';
                return `<div class="swiss-standing-row swiss-standing--winner">
                    <span class="swiss-standing-name">${matchTeamName(m, m.winner_id)} ✓</span>
                    <span class="swiss-standing-record">schlägt</span>
                    <span class="swiss-standing-bye">${tag}</span>
                    <span class="swiss-standing-status">${matchTeamName(m, m.loser_id)}</span>
                </div>`;
            }).join('');
        }

        function render() {
            const t = tournament;
            document.getElementById('tourn-title').textContent = t.name;

            const badge = document.getElementById('tourn-status-badge');
            badge.textContent = t.status === 'active' ? '● AKTIV' : '✓ ABGESCHLOSSEN';
            badge.className   = `tourn-status ${t.status === 'active' ? 'tourn-status--active' : 'tourn-status--done'}`;

            // Show close button for admin on active tournaments
            if (user.role === 'admin' && t.status === 'active') {
                document.getElementById('close-btn-wrap').style.display = 'block';
            }

            document.getElementById('tourn-setup-tags').innerHTML = `
                <span class="tourn-tag">${MODE_LABEL[t.mode]}${isInstant() ? ' ⚡ Sofort' : ''}</span>
                <span class="tourn-tag">${TYPE_LABEL[t.game_type]}</span>
                <span class="tourn-tag">${t.start_score}</span>
                <span class="tourn-tag">${OUT_LABEL[t.checkout]}</span>
                <span class="tourn-tag">${LEGS_LABEL(t.legs)}</span>
            `;

            document.getElementById('bracket-title').textContent =
                t.mode === 'swiss' ? 'WINNER-POOL · 0 NIEDERLAGEN' : 'TURNIERPLAN';

            if (t.mode === 'bounty') {
                // Hide bracket and swiss sections
                document.querySelector('.card:has(#bracket-tree)').style.display = 'none';
                document.getElementById('current-round-section').style.display  = 'none';
                document.getElementById('all-matches-section').style.display    = 'none';
                renderBounty();
            } else if (isInstant()) {
                // No rounds: the bracket tree makes no sense — matches, waiting players, results
                document.querySelector('.card:has(#bracket-tree)').style.display = 'none';
                document.getElementById('loser-bracket-card').style.display      = 'none';
                document.getElementById('current-round-section').style.display   = 'none';
                renderAllSwissMatches();
                renderInstantExtras();
                renderSwissStandings();
                document.getElementById('swiss-standings-card').style.display = 'block';
            } else {
                document.querySelector('.card:has(#bracket-tree)').style.display = '';
                document.getElementById('instant-waiting-card').style.display = 'none';
                document.getElementById('instant-results-card').style.display = 'none';
                renderBracketTree();
                if (t.mode === 'swiss') {
                    renderAllSwissMatches();
                    renderLoserBracket();
                    renderSwissStandings();
                    document.getElementById('swiss-standings-card').style.display = 'block';
                    document.getElementById('current-round-section').style.display = 'none';
                } else {
                    renderCurrentRound();
                    document.getElementById('all-matches-section').style.display = 'none';
                }
            }
        }

        function renderSwissStandings() {
            const el = document.getElementById('swiss-standings');
            if (!el) return;
            const sorted = [...participants].sort((a, b) =>
                (b.wins||0) - (a.wins||0) || (a.losses||0) - (b.losses||0)
            );
            el.innerHTML = sorted.map(p => {
                const losses = p.losses || 0;
                const cls    = losses >= 2 ? 'swiss-standing--out' : losses === 0 ? 'swiss-standing--winner' : 'swiss-standing--loser';
                const status = losses >= 2 ? '❌ Ausgeschieden' : losses === 0 ? '🟢 Winner Pool' : '🟡 Loser Pool';
                return `<div class="swiss-standing-row ${cls}">
                    <span class="swiss-standing-name">${p.name}</span>
                    <span class="swiss-standing-record">${p.wins||0}W – ${losses}L</span>
                    ${(p.bye_count||0) > 0 ? `<span class="swiss-standing-bye">Freilos ×${p.bye_count}</span>` : '<span></span>'}
                    <span class="swiss-standing-status">${status}</span>
                </div>`;
            }).join('');
        }

        async function closeTournament() {
            const ok = await showConfirm('Turnier schließen', `„${tournament.name}" wirklich schließen?`);
            if (!ok) return;
            await supa.from('tournaments').update({
                status:      'finished',
                closed_by:   user.username,
                finished_at: new Date().toISOString()
            }).eq('id', tournId);
            window.location.href = 'tournaments.html';
        }

        function renderBounty() {
            document.getElementById('bounty-standings-card').style.display = 'block';

            // Sort: alive first (by bounty desc), then eliminated
            const alive       = [...participants].filter(p => (p.lives || 0) > 0)
                                                 .sort((a, b) => (b.bounty||0) - (a.bounty||0));
            const eliminated  = [...participants].filter(p => (p.lives || 0) === 0)
                                                 .sort((a, b) => (b.bounty||0) - (a.bounty||0));
            const sorted      = [...alive, ...eliminated];
            const maxLives    = tournament.initial_lives || Math.max(...participants.map(p => p.lives||0), 1);

            document.getElementById('bounty-standings').innerHTML = sorted.map(p => {
                const isAlive   = (p.lives || 0) > 0;
                const hearts    = isAlive
                    ? '💙'.repeat(p.lives) + '🖤'.repeat(Math.max(0, maxLives - p.lives))
                    : '💀';
                const bountyFmt = `${parseFloat(p.bounty||0).toFixed(2).replace('.',',')} €`;
                return `
                <div class="bounty-row ${!isAlive ? 'bounty-row--out' : ''}">
                    <div class="bounty-row-left">
                        <span class="bounty-name">${p.name}</span>
                        <span class="bounty-hearts">${hearts}</span>
                    </div>
                    <span class="bounty-amount ${!isAlive ? '' : 'bounty-amount--alive'}">💰 ${bountyFmt}</span>
                </div>`;
            }).join('');

            // Current round matches
            const pending = matches.filter(m => m.status === 'pending' && m.p1_id && m.p2_id);
            const section = document.getElementById('bounty-matches-section');
            if (pending.length === 0) {
                section.style.display = 'none';
                return;
            }
            section.style.display = 'block';
            const currentRound = Math.max(...matches.map(m => m.round));
            document.getElementById('bounty-matches-title').textContent =
                `RUNDE ${currentRound} · ${pending.length} ${pending.length === 1 ? 'MATCH' : 'MATCHES'}`;

            document.getElementById('bounty-matches-list').innerHTML = pending.map(m => {
                const p1   = participants.find(p => p.id === m.p1_id);
                const p2   = participants.find(p => p.id === m.p2_id);
                const b1   = p1 ? `💰 ${parseFloat(p1.bounty||0).toFixed(2).replace('.',',')} €` : '';
                const b2   = p2 ? `💰 ${parseFloat(p2.bounty||0).toFixed(2).replace('.',',')} €` : '';
                return `
                <a ${matchLinkAttrs(m)} class="tourn-match-card">
                    <div class="tourn-match-players">
                        <div class="bounty-match-player">
                            <span class="tourn-match-player">${matchTeamName(m, m.p1_id)}</span>
                            <span class="bounty-match-tag">${b1}</span>
                        </div>
                        <span class="tourn-match-vs">VS</span>
                        <div class="bounty-match-player bounty-match-player--right">
                            <span class="tourn-match-player">${matchTeamName(m, m.p2_id)}</span>
                            <span class="bounty-match-tag">${b2}</span>
                        </div>
                    </div>
                    <div class="tourn-match-action">${startLabel(m)}</div>
                </a>`;
            }).join('');
        }

        function renderBracketTree() {
            const winnerMatches = matches.filter(m => m.bracket === 'winners' || m.bracket === 'final');
            const rounds = [...new Set(winnerMatches.map(m => m.round))].sort((a,b) => a - b);
            const maxRound = Math.max(...rounds);

            const el = document.getElementById('bracket-tree');
            el.innerHTML = '';

            rounds.forEach(r => {
                const col = document.createElement('div');
                col.className = 'bracket-col';

                const label = document.createElement('div');
                label.className = 'bracket-round-label';
                label.textContent = r === maxRound ? 'FINALE' : `RUNDE ${r}`;
                col.appendChild(label);

                const rMatches = winnerMatches.filter(m => m.round === r);
                rMatches.forEach(m => {
                    const card = document.createElement('div');
                    card.className = `bracket-match ${m.status === 'done' ? 'bracket-match--done' : m.status === 'active' ? 'bracket-match--active' : ''}`;

                    const p1name = partNameShort(m.p1_id);
                    const p2name = m.p2_id ? partNameShort(m.p2_id) : 'BYE';
                    const p1won  = m.winner_id === m.p1_id;
                    const p2won  = m.winner_id === m.p2_id;

                    card.innerHTML = `
                        <div class="bracket-player ${p1won ? 'bracket-player--winner' : (m.status === 'done' ? 'bracket-player--loser' : '')}">${m.p1_id ? p1name : 'Freilos'}</div>
                        <div class="bracket-divider"></div>
                        <div class="bracket-player ${p2won ? 'bracket-player--winner' : (m.status === 'done' && m.p2_id ? 'bracket-player--loser' : '')}">${m.p2_id ? p2name : 'Freilos'}</div>
                    `;
                    col.appendChild(card);
                });

                el.appendChild(col);
            });
        }

        function renderAllSwissMatches() {
            // Alle offenen Partien aus beiden Pools zusammen anzeigen
            const pending = matches.filter(m => m.status === 'pending' && m.p1_id && m.p2_id);
            const active  = matches.filter(m => m.status === 'active'  && m.p1_id && m.p2_id);
            const current = [...active, ...pending];

            const section = document.getElementById('all-matches-section');
            if (current.length === 0) {
                section.style.display = 'none';
                return;
            }

            section.style.display = 'block';
            const winnerCount = current.filter(m => m.bracket !== 'losers').length;
            const loserCount  = current.filter(m => m.bracket === 'losers').length;

            let titleParts = [];
            if (winnerCount > 0) titleParts.push(`${winnerCount} WINNER`);
            if (loserCount  > 0) titleParts.push(`${loserCount} LOSER`);
            document.getElementById('all-matches-title').textContent =
                `AKTUELLE PARTIEN · ${titleParts.join(' + ')}`;

            const el = document.getElementById('all-matches-list');
            el.innerHTML = current.map(m => {
                const isLoser   = m.bracket === 'losers';
                const isFinal   = m.bracket === 'final';
                const poolBadge = isLoser ? '<span class="match-pool-badge match-pool-badge--loser">LOSER POOL</span>'
                                : isFinal ? '<span class="match-pool-badge match-pool-badge--final">FINALE</span>'
                                :           '<span class="match-pool-badge match-pool-badge--winner">WINNER POOL</span>';
                const cardClass = isLoser ? 'tourn-match-card tourn-match-card--loser'
                                : isFinal ? 'tourn-match-card tourn-match-card--final'
                                :           'tourn-match-card';
                return `
                    <a ${matchLinkAttrs(m)} class="${cardClass}">
                        <div class="tourn-match-meta">${poolBadge}${isInstant() ? '' : `<span class="tourn-match-round">Runde ${m.round}</span>`}</div>
                        <div class="tourn-match-players">
                            <span class="tourn-match-player">${matchTeamName(m, m.p1_id)}</span>
                            <span class="tourn-match-vs">VS</span>
                            <span class="tourn-match-player">${matchTeamName(m, m.p2_id)}</span>
                        </div>
                        <div class="tourn-match-action">${startLabel(m)}</div>
                    </a>
                `;
            }).join('');
        }

        function renderCurrentRound() {
            const pending = matches.filter(m => m.status === 'pending' && m.p1_id && m.p2_id && m.bracket !== 'losers');
            if (pending.length === 0) {
                document.getElementById('current-round-section').style.display = 'none';
                return;
            }
            const currentRound   = Math.min(...pending.map(m => m.round));
            const currentMatches = pending.filter(m => m.round === currentRound);

            document.getElementById('current-round-section').style.display = 'block';
            document.getElementById('current-round-title').textContent =
                `RUNDE ${currentRound} · ${currentMatches.length} ${currentMatches.length === 1 ? 'MATCH' : 'MATCHES'}`;

            document.getElementById('current-round-matches').innerHTML = currentMatches.map(m => {
                return `
                    <a ${matchLinkAttrs(m)} class="tourn-match-card">
                        <div class="tourn-match-players">
                            <span class="tourn-match-player">${matchTeamName(m, m.p1_id)}</span>
                            <span class="tourn-match-vs">VS</span>
                            <span class="tourn-match-player">${matchTeamName(m, m.p2_id)}</span>
                        </div>
                        <div class="tourn-match-action">${startLabel(m)}</div>
                    </a>
                `;
            }).join('');
        }

        function renderLoserBracket() {
            const loserMatches = matches.filter(m => m.bracket === 'losers');
            if (loserMatches.length === 0) {
                document.getElementById('loser-bracket-card').style.display = 'none';
                return;
            }

            document.getElementById('loser-bracket-card').style.display = 'block';
            const rounds   = [...new Set(loserMatches.map(m => m.round))].sort((a, b) => a - b);
            const maxRound = Math.max(...rounds);
            const treeEl   = document.getElementById('loser-bracket-tree');
            treeEl.innerHTML = '';

            rounds.forEach(r => {
                const col = document.createElement('div');
                col.className = 'bracket-col';

                const label = document.createElement('div');
                label.className = 'bracket-round-label';
                label.textContent = r === maxRound && loserMatches.filter(m => m.round === r).length === 1
                    ? 'FINALE L.' : `RUNDE ${r}`;
                col.appendChild(label);

                loserMatches.filter(m => m.round === r).forEach(m => {
                    const card = document.createElement('div');
                    card.className = `bracket-match bracket-match--loser ${m.status === 'done' ? 'bracket-match--done' : ''}`;

                    const p1won = m.winner_id === m.p1_id;
                    const p2won = m.winner_id === m.p2_id;

                    card.innerHTML = `
                        <div class="bracket-player ${p1won ? 'bracket-player--winner' : (m.status === 'done' ? 'bracket-player--loser' : '')}">${m.p1_id ? partNameShort(m.p1_id) : 'Freilos'}</div>
                        <div class="bracket-divider"></div>
                        <div class="bracket-player ${p2won ? 'bracket-player--winner' : (m.status === 'done' && m.p2_id ? 'bracket-player--loser' : '')}">${m.p2_id ? partNameShort(m.p2_id) : 'Freilos'}</div>
                    `;
                    col.appendChild(card);
                });

                treeEl.appendChild(col);
            });
        }

        // ── JOKER TEAM (doubles with an odd number of players) ──
        // A team named "Max & 🎲" has one fixed player (Max) and gets a random partner for
        // EVERY match, drawn when the match is started: from the players of the other
        // teams, never from the opponent's team, and preferably someone who is free.
        const JOKER_SUFFIX = ' & 🎲';
        const isJokerName  = n => typeof n === 'string' && n.endsWith(JOKER_SUFFIX);
        const teamMembers  = n => n.split(' & ').map(s => s.trim()).filter(Boolean);

        // 'p1' | 'p2' | null — which side of the match is the joker team
        function jokerSideOf(match) {
            if (!tournament || tournament.game_type !== 'doubles') return null;
            if (isJokerName((participants.find(p => p.id === match.p1_id) || {}).name)) return 'p1';
            if (isJokerName((participants.find(p => p.id === match.p2_id) || {}).name)) return 'p2';
            return null;
        }

        // Team name as shown in the lists — after the draw: "Max & Anna 🎲"
        function matchTeamName(match, id) {
            const name = partName(id);
            if (isJokerName(name) && match.joker_partner) {
                return `${name.slice(0, -JOKER_SUFFIX.length)} & ${match.joker_partner} 🎲`;
            }
            return name;
        }

        // The name the game is played under: the joker replaced by the drawn partner
        function gameTeamName(match, id, partner) {
            const name = partName(id);
            return isJokerName(name) && partner ? `${name.slice(0, -JOKER_SUFFIX.length)} & ${partner}` : name;
        }

        // Match cards: a joker match opens the draw sheet before the game starts
        function matchLinkAttrs(m) {
            return jokerSideOf(m)
                ? `href="#" onclick="openJokerSheet('${m.id}'); return false;"`
                : `href="${buildGameUrl(m)}"`;
        }
        const startLabel = m => jokerSideOf(m) ? '🎲 Partner losen &amp; starten »' : '🎯 Spiel starten »';

        // Players that are in a live game right now (best effort, last 15 minutes)
        async function livePlayers() {
            const names = new Set();
            try {
                const since = new Date(Date.now() - 15 * 60000).toISOString();
                const { data } = await supa.from('live_game').select('state').not('state', 'is', null).gte('updated_at', since);
                (data || []).forEach(r => { const tp = r.state && r.state.teamPlayers; if (tp) tp.flat().forEach(n => names.add(n)); });
            } catch (e) { /* no live info — everybody counts as free */ }
            return names;
        }

        // Candidates in draw order: free players first (no live game, no open match of their
        // team), then those with an open match, then those currently playing; within a group
        // whoever helped out least so far; ties random.
        function rankJokerCandidates(match, side, busy) {
            const jokerPart   = participants.find(p => p.id === match[side + '_id']);
            const oppPart     = participants.find(p => p.id === match[(side === 'p1' ? 'p2' : 'p1') + '_id']);
            const jokerPlayer = jokerPart.name.slice(0, -JOKER_SUFFIX.length);
            const forbidden   = new Set([jokerPlayer, ...(oppPart ? teamMembers(oppPart.name) : [])]);

            const helps = {};
            matches.forEach(m => { if (m.joker_partner) helps[m.joker_partner] = (helps[m.joker_partner] || 0) + 1; });
            const hasOpenMatch = new Set();
            matches.forEach(m => { if (m.status === 'pending' && m.p1_id && m.p2_id) { hasOpenMatch.add(m.p1_id); hasOpenMatch.add(m.p2_id); } });

            const pool = [];
            participants.forEach(p => {
                if (isJokerName(p.name)) return;
                teamMembers(p.name).forEach(n => {
                    if (forbidden.has(n)) return;
                    pool.push({ name: n, tier: busy.has(n) ? 3 : hasOpenMatch.has(p.id) ? 2 : 1, helps: helps[n] || 0, r: Math.random() });
                });
            });
            pool.sort((a, b) => a.tier - b.tier || a.helps - b.helps || a.r - b.r);
            // A partner drawn earlier for this very match (game started before) stays first
            const kept = match.joker_partner ? pool.findIndex(c => c.name === match.joker_partner) : -1;
            if (kept > 0) pool.unshift(pool.splice(kept, 1)[0]);
            return { pool, jokerPlayer, oppName: oppPart ? oppPart.name : '?' };
        }

        let _jk = null; // { matchId, pool, idx, rolling }

        async function openJokerSheet(matchId) {
            const match = matches.find(m => m.id === matchId);
            const side  = match && jokerSideOf(match);
            if (!match || !side) return;

            const { pool, jokerPlayer, oppName } = rankJokerCandidates(match, side, await livePlayers());
            _jk = { matchId, pool, idx: 0, rolling: false, manual: false };

            document.getElementById('joker-sheet-sub').textContent = `${jokerPlayer} spielt gegen ${oppName}`;
            document.getElementById('joker-manual-list').style.display = 'none';
            if (pool.length === 0) {
                document.getElementById('joker-partner-name').textContent = '–';
                document.getElementById('joker-partner-hint').textContent = 'Kein Partner verfügbar — alle anderen Spieler sind im gegnerischen Team.';
                document.getElementById('joker-start-btn').disabled  = true;
                document.getElementById('joker-reroll-btn').disabled = true;
                document.getElementById('joker-manual-btn').disabled = true;
            } else {
                document.getElementById('joker-start-btn').disabled  = false;
                document.getElementById('joker-reroll-btn').disabled = pool.length < 2;
                document.getElementById('joker-manual-btn').disabled = pool.length < 2;
                showJokerPartner();
            }
            openSheet('joker-sheet', 'joker-sheet-overlay');
        }

        function showJokerPartner() {
            const c = _jk.pool[_jk.idx];
            const match = matches.find(m => m.id === _jk.matchId);
            const parts = [];
            parts.push(c.tier === 1 ? 'Hat gerade nichts zu tun' : c.tier === 2 ? 'Hat noch ein eigenes Spiel offen' : 'Spielt gerade ein anderes Spiel');
            if (c.helps > 0) parts.push(`hat schon ${c.helps}× ausgeholfen`);
            if (_jk.manual) parts.unshift('Von Hand gewählt');
            else if (match && match.joker_partner === c.name) parts.unshift('Für dieses Spiel schon gelost');
            document.getElementById('joker-partner-name').textContent = c.name;
            document.getElementById('joker-partner-hint').textContent = parts.join(' · ');
        }

        // Short roulette, then the next candidate of the ranking
        async function rerollJoker() {
            if (!_jk || _jk.rolling || _jk.pool.length < 2) return;
            _jk.rolling = true;
            const nameEl = document.getElementById('joker-partner-name');
            document.getElementById('joker-start-btn').disabled  = true;
            document.getElementById('joker-reroll-btn').disabled = true;
            document.getElementById('joker-manual-list').style.display = 'none';
            for (let i = 0; i < 9; i++) {
                nameEl.textContent = _jk.pool[Math.floor(Math.random() * _jk.pool.length)].name;
                await new Promise(r => setTimeout(r, 60 + i * 18));
            }
            _jk.idx = (_jk.idx + 1) % _jk.pool.length;
            _jk.manual = false;
            showJokerPartner();
            _jk.rolling = false;
            document.getElementById('joker-start-btn').disabled  = false;
            document.getElementById('joker-reroll-btn').disabled = false;
        }

        // Pick the partner by hand: everybody who is allowed (same list as the draw),
        // free players first.
        function toggleJokerManual() {
            if (!_jk || _jk.rolling) return;
            const list = document.getElementById('joker-manual-list');
            if (list.style.display !== 'none') { list.style.display = 'none'; return; }
            const tierText = t => t === 1 ? 'frei' : t === 2 ? 'eigenes Spiel offen' : 'spielt gerade';
            list.innerHTML = _jk.pool.map((c, i) => `
                <button type="button" class="guest-pick${i === _jk.idx ? ' guest-pick--on' : ''}" onclick="pickJokerPartner(${i})">
                    <span class="guest-pick-name">${escHtml(c.name)}</span>
                    <span class="joker-pick-tier">${tierText(c.tier)}</span>
                    <span class="guest-pick-check">${i === _jk.idx ? '✓' : ''}</span>
                </button>`).join('');
            list.style.display = 'flex';
            list.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        }

        function pickJokerPartner(i) {
            if (!_jk) return;
            _jk.idx    = i;
            _jk.manual = true;
            document.getElementById('joker-manual-list').style.display = 'none';
            showJokerPartner();
        }

        function closeJokerSheet() {
            closeSheet('joker-sheet', 'joker-sheet-overlay');
            _jk = null;
        }

        async function startJokerMatch() {
            if (!_jk || _jk.rolling) return;
            const match = matches.find(m => m.id === _jk.matchId);
            if (!match) return;
            const partner = _jk.pool[_jk.idx].name;
            // Remember who helped (feeds the fair rotation and the match list); the game
            // starts either way — before sql/tournament-joker.sql the column does not exist.
            const { error } = await supa.from('tournament_matches').update({ joker_partner: partner }).eq('id', match.id);
            if (error) console.warn('Joker-Partner nicht gespeichert:', error.message);
            window.location.href = buildGameUrl(match, partner);
        }

        function buildGameUrl(match, partner) {
            const t   = tournament;
            const p1  = gameTeamName(match, match.p1_id, partner);
            const p2  = gameTeamName(match, match.p2_id, partner);
            const url = new URL('game.html', window.location.href);
            url.searchParams.set('tournament_match_id', match.id);
            url.searchParams.set('tournament_id', tournId);
            url.searchParams.set('tournament_p1_id', match.p1_id);
            url.searchParams.set('tournament_p2_id', match.p2_id);
            url.searchParams.set('start_score', t.start_score);
            url.searchParams.set('checkout', t.checkout);
            url.searchParams.set('legs', t.legs);
            url.searchParams.set('game_type', t.game_type);
            url.searchParams.set('p1', p1);
            url.searchParams.set('p2', p2);
            url.searchParams.set('skip_setup', '1');
            url.searchParams.set('is_official', t.is_official === false ? '0' : '1');
            return url.toString();
        }

        load();
        // Refresh every 15s for live updates
        setInterval(load, 15000);
    </script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/fightclub-dart-tracker/sw.js').catch(() => {});
        }
    </script>
</body>
